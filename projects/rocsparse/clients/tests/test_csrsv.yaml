---
include: rocsparse_common.yaml


Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }

  - &M_N_range_checkin
    - { M:  -1, N:  -1 }

  - &M_N_range_nightly
    - { M:   9381, N:   9381 }
    - { M:  37017, N:  37017 }

  - &alpha_range_quick
    - { alpha:   1.0, alphai: 0.0 }


  - &alpha_range_checkin
    - { alpha:   2.0, alphai:  0.0 }

    - { alpha:   3.0, alphai: -1.0 }

  - &alpha_range_nightly
    - { alpha:   0.0,  alphai: -0.75 }
    - { alpha:   0.25, alphai:  0.0 }
    - { alpha:  -0.75, alphai:  0.25 }

Tests:
- name: csrsv_file
  category: quick
  function: csrsv
  precision: *double_only_precisions
  M: 1
  N: 1
  alpha_alphai: *alpha_range_quick
  transA: [rocsparse_operation_none]
  diag: [rocsparse_diag_type_unit]
  uplo: [rocsparse_fill_mode_lower]
  apol: [rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos5]
