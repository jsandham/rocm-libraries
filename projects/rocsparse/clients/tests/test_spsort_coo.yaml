---
include: rocsparse_common.yaml


Tests:
- name: spsort_coo_bad_arg
  category: pre_checkin
  function: spsort_coo_bad_arg
  indextype: *i32_i64
  precision: *single_double_precisions_complex_real

- name: spsort_coo
  category: quick
  function: spsort_coo
  indextype: *i32_i64
  precision: *single_double_precisions
  M: [10]
  N: [33]
  baseA: *all_rocsparse_index_base
  direction: *all_rocsparse_direction
  matrix: [rocsparse_matrix_zero]

- name: spsort_coo
  category: quick
  function: spsort_coo
  indextype: *i32_i64
  precision: *single_double_precisions
  M: [1, 10, 300]
  N: [1, 33, 242]
  baseA: *all_rocsparse_index_base
  direction: *all_rocsparse_direction
  matrix: [rocsparse_matrix_random]

- name: spsort_coo_file
  category: quick
  function: spsort_coo
  indextype: *i32
  precision: *single_double_precisions
  M: 1
  N: 1
  baseA: [rocsparse_index_base_zero]
  direction: *all_rocsparse_direction
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos1,
             nos3,
             nos5,
             nos7]

- name: spsort_coo
  category: pre_checkin
  function: spsort_coo
  indextype: *i32_i64
