             mc2depi,
             ASIC_320k]

- name: spsort_coo_file
  category: pre_checkin
  function: spsort_coo
  indextype: *i32_i64
  precision: *single_double_precisions_complex
  M: 1
  N: 1
  baseA: [rocsparse_index_base_one]
  direction: *all_rocsparse_direction
